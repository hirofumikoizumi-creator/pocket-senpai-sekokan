name: EAS iOS Production Build

on:
  workflow_dispatch:
    inputs:
      submit:
        description: "Submit to App Store Connect after the build"
        required: true
        type: boolean
        default: false
      what_to_test:
        description: "TestFlight What to Test text"
        required: false
        type: string
        default: "建設・土木の施工管理学習アプリのTestFlightビルドです。先輩相談、現場トーク、業務別マニュアル、チェックリスト、ミニ学習クイズを確認してください。"

jobs:
  build-ios:
    name: Build iOS production app
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_BUILD_NO_EXPO_GO_WARNING: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          lfs: true

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Verify Expo token
        if: ${{ env.EXPO_TOKEN == '' }}
        run: |
          echo "::error::GitHub repository secret EXPO_TOKEN is required to run EAS builds."
          exit 1

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Expo Doctor
        run: npm run doctor

      - name: Build on EAS
        if: ${{ !inputs.submit }}
        run: npx eas-cli@latest build --platform ios --profile production --non-interactive --no-wait --message "Manual GitHub Actions production build"

      - name: Build and submit on EAS
        if: ${{ inputs.submit }}
        run: npx eas-cli@latest build --platform ios --profile production --non-interactive --no-wait --auto-submit-with-profile production --message "Manual GitHub Actions production build and submit"
